name: EAS Update

# Publishes an OTA update to the EAS channel that matches the pushed branch.
# Channels come from eas.json (development / preview / production). Because
# runtimeVersion uses the "appVersion" policy, an update only reaches builds
# whose app.json "version" matches the one in the pushed commit.
#
#   branch        -> channel / EAS environment
#   production    -> production
#   main          -> preview
#   development   -> development

on:
  push:
    branches:
      - production
      - main
      - development
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish to
        required: true
        type: choice
        options:
          - preview
          - production
          - development
      message:
        description: Update message (defaults to the last commit message)
        required: false
        type: string

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eas-update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Resolve channel
        id: target
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_CHANNEL" ]; then
            channel="$INPUT_CHANNEL"
          else
            case "$BRANCH" in
              production)  channel=production ;;
              main)        channel=preview ;;
              development) channel=development ;;
              *) echo "No channel mapped for branch '$BRANCH'"; exit 1 ;;
            esac
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Publishing to channel: $channel"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # --environment pulls the EXPO_PUBLIC_* variables from EAS (the local .env
      # is gitignored), so they must be defined there for each environment.
      - name: Publish update
        env:
          CHANNEL: ${{ steps.target.outputs.channel }}
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
        run: |
          eas update \
            --channel "$CHANNEL" \
            --environment "$CHANNEL" \
            --platform all \
            --message "${MESSAGE:-Update from ${GITHUB_SHA::7}}" \
            --non-interactive
