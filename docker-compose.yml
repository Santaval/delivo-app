version: '3.8'

services:
  tributocr-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tributocr-dev-server
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo Dev Tools
      - "19001:19001" # Expo Dev Tools (HTTP)
      - "19002:19002" # Expo Dev Tools (HTTPS)
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      # Mount .env file
      - ./.env:/app/.env:ro
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-0.0.0.0}
    network_mode: "host"
    stdin_open: true
    tty: true
