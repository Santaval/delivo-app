# Docker Compose configuration optimized for Coolify deployment
# Use this as reference when setting up in Coolify's interface

version: '3.8'

services:
  tributocr-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tributocr-dev-server
    ports:
      - "8081:8081"   # Metro bundler (main port)
      - "19000:19000" # Expo Dev Tools
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # Set this to your Coolify domain in Coolify's environment variables
      - REACT_NATIVE_PACKAGER_HOSTNAME=${COOLIFY_URL:-localhost}
      - CI=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Note: In Coolify, you don't need to manually create this file.
# Instead, use Coolify's interface to:
# 1. Set build context to use Dockerfile
# 2. Map port 8081 as the primary port
# 3. Add environment variables in Coolify's env section
